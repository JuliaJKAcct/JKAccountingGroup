<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./banner.css">
<title>JK Accounting Group — LinkedIn Page banner · A · Nameplate (1128×191)</title>
<style>
  .stage{
    background:radial-gradient(130% 300% at 70% 24%, var(--teal-lift) 0%, var(--teal) 30%, var(--teal-deep) 62%, var(--teal-darkest) 100%);
  }
  .glow{
    position:absolute;top:50%;left:1150px;transform:translate(-50%,-50%);
    width:640px;height:640px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(236,230,218,.075) 0%, rgba(207,162,104,.045) 36%, rgba(22,63,71,0) 68%);
  }
  .rail .line{color:var(--ivory-muted)}
  .sub{color:var(--ivory)}
  .headline{color:var(--ivory)}
  .rail .line.url{color:var(--ivory)}
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <!-- The Medallion's double ring, scaled far past the frame and cropped by it —
         same 57:50.5 radius ratio, same bronze diamond pinning it at mid-height
         (brand/logo/svg/JK-medallion-primary.svg). It occupies the right field,
         which the desktop layout leaves open; the phone crop never needs it. -->
    <svg class="rings" viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none">
        <circle cx="1150" cy="96" r="178" stroke="rgba(236,230,218,.10)" stroke-width="1.5"></circle>
        <circle cx="1150" cy="96" r="158" stroke="rgba(207,162,104,.16)" stroke-width="1"></circle>
      </g>
      <path d="M972 92.5 l3.5 3.5 -3.5 3.5 -3.5 -3.5 z" fill="rgba(207,162,104,.42)"></path>
    </svg>
    <div class="content">
      <div class="left">
        <h1 class="headline">Your US Finance Department</h1>
        <p class="sub">For Ukrainian- and Russian-speaking business owners in the US.</p>
      </div>
      <div class="rail">
        <div class="line">Tax &middot; Bookkeeping &middot; CFO</div>
        <div class="line url">jkaccountinggroup.com</div>
      </div>
    </div>
  </div>
</body>
</html>
