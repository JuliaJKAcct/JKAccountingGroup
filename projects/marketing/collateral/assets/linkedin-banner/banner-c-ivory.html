<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./banner.css">
<title>JK Accounting Group — LinkedIn Page banner · C · Ivory (1128×191)</title>
<style>
  /* The light register. LinkedIn's own page is white, so a paper-coloured band
     has to prove it is an image and not a failed load. The frame and the
     deep-teal foot do that at full height — but the tightest crop keeps only the
     middle of the height and throws BOTH away, so the field itself has to carry
     the difference: it is based on --page, the design system's warmest surface,
     never on white, and it deepens toward the right instead of lifting toward it.
     At any crop the strip still reads as warm paper against LinkedIn's white. */
  .stage{
    background:
      radial-gradient(130% 280% at 32% 12%, var(--paper) 0%, var(--page) 46%, #EFE9DD 100%);
    box-shadow:inset 0 0 0 1px var(--hair-light);
  }
  .foot{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--teal)}
  .rail .line{color:var(--ink-muted)}
  .sub{color:var(--ink-body)}
  .headline{color:var(--teal)}
  .rail .line.url{color:var(--ink)}
</style>
</head>
<body>
  <div class="stage">
    <!-- The Medallion's double ring, scaled far past the frame and cropped by it —
         same 57:50.5 radius ratio, same bronze diamond pinning it at mid-height
         (brand/logo/svg/JK-medallion-primary.svg). It occupies the right field,
         which the desktop layout leaves open; the phone crop never needs it. -->
    <svg class="rings" viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none">
        <circle cx="1150" cy="96" r="178" stroke="rgba(18,56,65,.13)" stroke-width="1.5"></circle>
        <circle cx="1150" cy="96" r="158" stroke="rgba(156,106,57,.26)" stroke-width="1"></circle>
      </g>
      <path d="M972 92.5 l3.5 3.5 -3.5 3.5 -3.5 -3.5 z" fill="rgba(156,106,57,.55)"></path>
    </svg>
    <div class="content">
      <div class="left">
        <h1 class="headline">Your US Finance Department</h1>
        <p class="sub">For Ukrainian- and Russian-speaking business owners in the US.</p>
      </div>
      <div class="rail">
        <div class="line">Tax &middot; Bookkeeping &middot; CFO</div>
        <div class="line url">jkaccountinggroup.com</div>
      </div>
    </div>
    <div class="foot"></div>
  </div>
</body>
</html>
