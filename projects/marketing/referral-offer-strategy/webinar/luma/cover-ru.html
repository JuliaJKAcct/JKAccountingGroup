<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#222}
  .cover{
    position:relative; width:1400px; height:1400px; overflow:hidden;
    background:radial-gradient(120% 95% at 50% -4%, rgba(207,162,104,.18), transparent 56%),linear-gradient(158deg,#123841,#0D2A31 66%,#091F24);
    color:#fff; font-family:"Source Serif 4",Georgia,serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:110px 120px;
  }
  .mark{width:190px; margin-bottom:56px}
  .tag{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:40px; letter-spacing:.16em; text-transform:uppercase; color:#CFA268; margin-bottom:52px}
  h1{font-family:"Source Serif 4",Georgia,serif; font-weight:700; font-size:132px; line-height:1.02; letter-spacing:-0.025em; color:#fff; text-wrap:balance; max-width:13ch}
  h1 em{font-style:italic; color:#CFA268}
  .name{position:absolute; bottom:88px; left:0; right:0; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:34px; letter-spacing:.14em; text-transform:uppercase; color:#7E9599}
</style>
</head>
<body>
<div class="cover">

  <!-- JK medallion mark (reversed) -->
  <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="JK Accounting Group">
    <circle cx="60" cy="60" r="57" fill="none" stroke="#ECE6DA" stroke-width="3.4"></circle>
    <circle cx="60" cy="60" r="50.5" fill="none" stroke="#CFA268" stroke-width="1.6"></circle>
    <g fill="#CFA268">
      <path d="M7 56.5 l3.6 3.5 -3.6 3.5 -3.5 -3.5 z"></path>
      <path d="M113 56.5 l3.5 3.5 -3.5 3.5 -3.6 -3.5 z"></path>
    </g>
    <g transform="translate(60,60) scale(0.62) translate(-59,-56)">
      <g fill="none" stroke="#ECE6DA" stroke-width="9">
        <path d="M55 26 L55 70 Q55 86 39 86 Q26 86 23.5 74.5"></path>
        <path d="M70 26 L70 86"></path><path d="M70 56 L92 26"></path><path d="M70 56 L95 86"></path>
      </g>
    </g>
  </svg>

  <p class="tag">Бесплатный вебинар</p>
  <h1>Почему бизнес растёт, а прибыль <em>уменьшается</em></h1>

  <div class="name">JK Accounting Group</div>

</div>
</body>
</html>
