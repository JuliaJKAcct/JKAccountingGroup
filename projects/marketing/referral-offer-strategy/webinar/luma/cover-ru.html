<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#222}
  .cover{
    position:relative; width:1600px; height:900px; overflow:hidden;
    background:radial-gradient(120% 130% at 84% -8%, rgba(207,162,104,.16), transparent 52%),linear-gradient(150deg,#123841,#0D2A31 70%,#091F24);
    color:#ECE6DA; font-family:"IBM Plex Mono",monospace;
    padding:92px 100px;
  }
  .lockup{position:absolute; top:80px; left:100px; width:360px}
  .wm{position:absolute; right:-90px; bottom:-120px; width:640px; opacity:.05}
  .content{position:absolute; left:100px; top:334px; right:100px}
  .kicker{font-family:"IBM Plex Mono",monospace; font-size:22px; letter-spacing:.22em; text-transform:uppercase; color:#CFA268; margin-bottom:34px}
  h1{font-family:"Source Serif 4",Georgia,serif; font-weight:600; font-size:104px; line-height:1.02; letter-spacing:-0.022em; color:#fff; max-width:20ch}
  h1 em{font-style:italic; color:#CFA268}
  .sub{font-family:"IBM Plex Mono",monospace; font-size:24px; letter-spacing:.02em; color:#9FB3B6; margin-top:36px}
  .who{position:absolute; left:100px; bottom:84px; font-family:"IBM Plex Mono",monospace; font-size:22px; letter-spacing:.04em; color:#9FB3B6}
  .who b{color:#fff; font-family:"Source Serif 4",serif; font-weight:600}
  .site{position:absolute; right:100px; bottom:84px; font-family:"IBM Plex Mono",monospace; font-size:20px; letter-spacing:.08em; color:#7E8F92}
</style>
</head>
<body>
<div class="cover">

  <!-- reversed lockup -->
  <svg class="lockup" viewBox="0 0 470 130" role="img" aria-label="JK Accounting Group">
    <g transform="translate(6,5)">
      <circle cx="60" cy="60" r="57" fill="none" stroke="#ECE6DA" stroke-width="3"></circle>
      <circle cx="60" cy="60" r="50.5" fill="none" stroke="#CFA268" stroke-width="1.4"></circle>
      <g fill="#CFA268">
        <path d="M7 56.5 l3.5 3.5 -3.5 3.5 -3.5 -3.5 z"></path>
        <path d="M113 56.5 l3.5 3.5 -3.5 3.5 -3.5 -3.5 z"></path>
      </g>
      <g transform="translate(60,60) scale(0.6) translate(-59,-56)">
        <g fill="none" stroke="#ECE6DA" stroke-width="9">
          <path d="M55 26 L55 70 Q55 86 39 86 Q26 86 23.5 74.5"></path>
          <path d="M70 26 L70 86"></path>
          <path d="M70 56 L92 26"></path>
          <path d="M70 56 L95 86"></path>
        </g>
      </g>
    </g>
    <text x="150" y="63" font-family="'Source Serif 4',Georgia,serif" font-size="33" font-weight="600" fill="#FFFFFF">JK Accounting Group</text>
    <text x="152" y="86" font-family="'IBM Plex Mono',monospace" font-size="11.5" letter-spacing="3" fill="#CFA268">TAX · BOOKKEEPING · CFO</text>
  </svg>

  <!-- faint watermark medallion -->
  <svg class="wm" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="57" fill="none" stroke="#ECE6DA" stroke-width="3"></circle>
    <circle cx="60" cy="60" r="50.5" fill="none" stroke="#ECE6DA" stroke-width="1.4"></circle>
    <g transform="translate(60,60) scale(0.6) translate(-59,-56)">
      <g fill="none" stroke="#ECE6DA" stroke-width="9">
        <path d="M55 26 L55 70 Q55 86 39 86 Q26 86 23.5 74.5"></path>
        <path d="M70 26 L70 86"></path><path d="M70 56 L92 26"></path><path d="M70 56 L95 86"></path>
      </g>
    </g>
  </svg>

  <div class="content">
    <p class="kicker">Бесплатный вебинар для владельцев бизнеса</p>
    <h1>Почему бизнес растёт,<br>а прибыль <em>уменьшается</em></h1>
    <p class="sub">4 причины, по которым деньги утекают незаметно — и как найти их у себя</p>
  </div>

  <div class="who"><b>Юлия Кононова</b> · JK Accounting Group</div>
  <div class="site">jkaccountinggroup.com</div>

</div>
</body>
</html>
